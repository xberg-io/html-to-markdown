
version = "5.0"
default_layers = ["plugins"]
name = 'html-to-markdown'
description = 'High-performance HTML to Markdown converter with active Python, TypeScript/Node, Ruby, PHP, Go, Java/JNI, C#, Elixir, R, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
presets = ["claude", "codex", "opencode", "pi", "hermes", "gemini", "copilot"]
# ~keep CLAUDE.md without the glob-scoped rules: they load from .claude/rules on a matching read.
agents_md = false
builtins = ["!agent-delegation", "!git-workflow", "default-commands"]

compact = true
[header]
style = 'minimal'

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "bca4b4e8f1f198bef25308aaabf7a2c238a387a3"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "bca4b4e8f1f198bef25308aaabf7a2c238a387a3"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "bca4b4e8f1f198bef25308aaabf7a2c238a387a3"
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-infrastructure'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "bca4b4e8f1f198bef25308aaabf7a2c238a387a3"
path = 'modules/infrastructure'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-e2e-generator'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "bca4b4e8f1f198bef25308aaabf7a2c238a387a3"
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'

ref = "613e2b06975b1d3a0d776ca141dec7b540e9ed74"
[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@0.0.83']

[defaults]
effort = 'medium'

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false

[lint]
# ~keep Alef publishes the canonical html-to-markdown MCP reference as the mcp skill.
allow_overrides = ["claude:mcp", "python-conventions"]
