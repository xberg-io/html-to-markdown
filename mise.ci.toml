# Loaded only with MISE_ENV=ci, so the versions CI selects with setup-mise `tools: <tool>=<version>` stay
# locked. python: the e2e matrices run 3.10, 3.12 and 3.14. ruby: 3.3 is the Ruby the release builds the
# host-platform gems against, and the e2e matrices run 3.2 and 3.3. java: the Kotlin Android host-JVM
# test builds with the JDK 17 the Android Gradle plugin targets. ~keep
[tools]
python = ["3.13.18", "3.10.22", "3.12.16", "3.14.10"]
ruby = ["3.4.12", "3.3.13", "3.2.11"]
java = ["temurin-25.0.5+8.0.LTS", "temurin-17.0.20+101"]
