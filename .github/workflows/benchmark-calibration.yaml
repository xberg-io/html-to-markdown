name: Benchmark Calibration

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: "ci"
  HTMBENCH_RUNNER_CLASS: github-hosted

jobs:
  collect:
    name: "Benchmark: Collect calibration campaign"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmark-calibration

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Collect calibration captures
        run: task bench:calibration:collect
        shell: bash

      - name: Upload raw calibration campaign
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-calibration-${{ github.run_id }}
          path: benchmark-calibration/
          if-no-files-found: error
          retention-days: 30
