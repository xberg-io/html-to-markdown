    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: c-ffi-${{ matrix.runner }}
          use-sccache: false

      - name: Build html-to-markdown-ffi
        shell: bash
        run: cargo build --release --locked -p html-to-markdown-ffi

      - name: Run C e2e tests
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: cd e2e/c && make test

      - name: Verify header is fresh
        shell: bash
        run: |
          HEADER="crates/html-to-markdown-ffi/include/html_to_markdown.h"
          test -f "$HEADER"
          git diff --exit-code -- "$HEADER" || {
            echo "::error::$HEADER is stale — cbindgen regenerated a different header than the one committed. Run 'cargo build -p html-to-markdown-ffi' and commit the result."
            exit 1
          }
          echo "Header verified fresh: $HEADER"

      - name: Verify pkg-config output
        shell: bash
        run: |
          PC_DIR="$(pwd)/target/release/build"
          PC_FILE=$(find "$PC_DIR" -name 'html-to-markdown.pc' -path '*/html-to-markdown-ffi-*/out/*' 2>/dev/null | head -1)
          if [ -z "$PC_FILE" ]; then
            echo "Warning: html-to-markdown.pc not found in build output"
            find "$PC_DIR" -name '*.pc' 2>/dev/null || echo "No .pc files found"
          else
            echo "Found pkg-config file: $PC_FILE"
            cat "$PC_FILE"
          fi

  test-c-ffi-windows:
    needs: [build-ffi, changes]
    name: "Test: C FFI (windows-latest)"
    if: |
      always() && !cancelled() && needs.build-ffi.result != 'skipped' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.ffi == 'true' ||
       needs.changes.outputs.core == 'true')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: c-ffi-windows
          use-sccache: false

      - name: Build html-to-markdown-ffi
        shell: bash
        run: cargo build --locked -p html-to-markdown-ffi

      - name: Verify header is fresh
        shell: bash
        run: |
          HEADER="crates/html-to-markdown-ffi/include/html_to_markdown.h"
          test -f "$HEADER"
          git diff --exit-code -- "$HEADER" || {
            echo "::error::$HEADER is stale — cbindgen regenerated a different header than the one committed. Run 'cargo build -p html-to-markdown-ffi' and commit the result."
            exit 1
          }
          echo "Header verified fresh on Windows: $HEADER"

  test-wasm:
    needs: [build-wasm]
    name: "Test: WASM"
    if: always() && !cancelled() && needs.build-wasm.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: wasm32-unknown-unknown
          use-sccache: false

      - name: Ensure wasm target installed
        run: scripts/common/ensure-wasm-target.sh
        shell: bash

      - name: Install wasm-pack
        run: scripts/common/install-wasm-pack.sh
        shell: bash

      - name: Setup Node workspace
        uses: xberg-io/actions/setup-node-workspace@v1

      - name: Build WASM (all targets)
        uses: xberg-io/actions/build-wasm-package@v1
        with:
          crate-dir: crates/html-to-markdown-wasm

      - name: Test WASM bundle
        working-directory: crates/html-to-markdown-wasm
        run: ../../scripts/ci/wasm/test-wasm-bundle.sh
        shell: bash

      - name: Run Rust WASM tests
        working-directory: crates/html-to-markdown-wasm
        run: ../../scripts/ci/wasm/test-wasm-rust.sh
        shell: bash

  build-kotlin-android:
    needs: [changes]
    name: "Build: Kotlin Android"
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.ffi == 'true' ||
      needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          cache-key-prefix: kotlin-android

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      # ~keep Bundle the JNI crate (libhtm_jni.so) that the Kotlin bridge loads via
      # System.loadLibrary("htm_jni") — NOT the plain C-FFI crate, whose lib*_ffi.so
      # lacks the JNI entry points (html-to-markdown#446). This mirrors the exact
      # crate/lib pair the publish workflow's kotlin-android-natives job builds, so a
      # regression in the JNI crate surfaces here instead of only at publish time.
      - name: Build Android native libraries
        uses: xberg-io/actions/build-android-natives@v1
        with:
          crate-name: html-to-markdown-rs-jni
          lib-name: htm_jni
          abis: arm64-v8a,x86_64

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1

  # ~keep Kotlin/Android ships to Maven Central but was never compiled or tested in
  # CI (html-to-markdown audit #38) — build-kotlin-android above only cross-compiles
  # the native .so, it never invokes Gradle/Kotlin compilation. `gradle test` here
  # compiles the Kotlin facade against the host JVM and runs the e2e fixture suite
  # via a host-platform JNI build (see packages/kotlin-android/build.gradle.kts'
  # buildHostJni/copyHostJni tasks) — no Android emulator required.
  test-kotlin-android:
    needs: [changes]
    name: "Test: Kotlin Android (host JVM)"
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.ffi == 'true' ||
      needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: kotlin-android-test

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Compile and test Kotlin Android binding (host JVM)
        run: alef test --e2e --lang kotlin_android
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1

