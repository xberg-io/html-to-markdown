      needs.changes.outputs.java == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["25"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: java-${{ matrix.os }}

      - name: Test Java Panama FFI bindings
        uses: xberg-io/actions/test-java-ffi@v1
        with:
          ffi-crate-name: html-to-markdown-ffi
