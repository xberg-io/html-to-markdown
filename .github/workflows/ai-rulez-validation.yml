name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-ai-rulez-validation.yml@v1
    with:
      expected-config-count: "2"
      additional-config-directories: "plugin/.ai-rulez"
      verify-plugin: true
      version-sync-script: "scripts/sync_plugin_version.py"
      public-skills-check-script: "scripts/sync_public_skills.py"
      # ~keep Budgets: the --measure-mcp ai-rulez measurement plus about 5%; re-measure on every pin bump.
      budgets: |
        claude=5850
        codex=6450
