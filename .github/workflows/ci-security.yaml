name: CI Security

# Dependency vulnerability / advisory gate (html-to-markdown audit #40). Neither
# `cargo deny check` (deny.toml already exists at repo root and is fully configured)
# nor `pnpm audit` were ever wired into CI — this workflow closes that gap.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-security.yaml"
  workflow_dispatch: {}
  schedule:
    # Catch newly-published advisories against unchanged dependencies.
    - cron: "17 6 * * 1"

# ~keep `github.sha` not `github.ref` for pushes: a cancelled run reports neither pass
# ~keep nor fail, and cancelling main's previous run is one of the two ways 3.15.0's R break shipped.
concurrency:
  group: ci-security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-audit:
    name: "Audit: Rust dependencies (cargo-deny)"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: security-rust-audit

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: cargo-deny

      - name: cargo deny check
        run: mise run rust:audit
        shell: bash

  node-audit:
    name: "Audit: Node.js dependencies (pnpm audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: pnpm

      - name: Setup Node.js workspace
        uses: xberg-io/actions/setup-node-workspace@v1

      - name: pnpm audit
        run: mise run node:audit
        shell: bash
