name: CI Plugin

# Freshness gate for the coding-agent plugin (lives in plugin/, generated by ai-rulez).
# Verifies the generated per-runtime bundles match plugin/.ai-rulez (BLAKE3 provenance)
# and that the plugin version tracks the core Cargo.toml version. Regenerate locally with
# `task plugin:generate`; re-sync the version with `task version:sync`.

on:
  push:
    branches: [main]
    paths:
      # Cargo.toml is the version source of truth the plugin must track. Without it
      # here a release commit — which bumps Cargo.toml and nothing under plugin/ —
      # does not trigger this workflow, so the version gate below never runs and the
      # plugin silently falls a release behind. That is how plugin/ sat at 3.11.3
      # while core shipped 3.11.4. ~keep
      - "Cargo.toml"
      - "plugin/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config.toml"
      - "scripts/sync_plugin_version.py"
      - ".task/tools/version-sync.yml"
      - "scripts/tests/**"
      - ".github/workflows/ci-plugin.yaml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "plugin/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config.toml"
      - "scripts/sync_plugin_version.py"
      - ".task/tools/version-sync.yml"
      - "scripts/tests/**"
      - ".github/workflows/ci-plugin.yaml"
  workflow_dispatch:

concurrency:
  group: ci-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-freshness:
    name: Plugin bundle freshness
    if: github.repository == 'xberg-io/html-to-markdown' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      # Plugin version must track the core crate version (task version:sync keeps it pinned).
      - name: Verify plugin version tracks core
        run: python3 scripts/sync_plugin_version.py --check
      # Byte-verify the ai-rulez-generated bundles under plugin/ match plugin/.ai-rulez.
      # Pinned to the ai-rulez version that generates them; bump in lockstep. ~keep
      - name: Verify generated plugin bundles are current
        run: uvx ai-rulez==4.11.0 verify --recursive --plugin --if-configured

  launcher-contract:
    name: Launcher contract on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because the launcher probes the host for npx, uvx and brew and resolves a
        # platform triple from `uname`. A Linux-only job would never execute the macOS arm of
        # either decision. ~keep
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Bats
        uses: xberg-io/actions/install-bats@v1
        with:
          # Passed explicitly rather than relying on the action default: a default only helps the
          # caller who omits it, and omitting it is how a workflow reads as pinned while
          # installing whatever the registry served that morning. ~keep
          version: "1.14.0"

      - name: Run the launcher contract tests
        uses: xberg-io/actions/run-bats@v1
        env:
          # `bats_load_library` searches BATS_LIB_PATH and nothing else. run-bats grew a lib-path
          # input for this, but it is not in the released v1 yet, so the variable is set here;
          # switch to `lib-path: scripts/tests/lib` once actions ships it. ~keep
          BATS_LIB_PATH: ${{ github.workspace }}/scripts/tests/lib
        with:
          path: scripts/tests/bats
          args: |-
            --recursive
            --print-output-on-failure
