name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/*/native/**"
      - "packages/*/ext/**"
      - "packages/*/src/**"
      - "packages/*/rust/**"
      - "tools/benchmark-harness/**"
      - "tools/e2e-generator/**"
      - "e2e/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/config.toml"
      - "fixtures/**"
      - ".github/workflows/ci-rust.yaml"
      - "alef.toml"
      - ".alef-ownership.toml"
      - "poly.toml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/*/native/**"
      - "packages/*/ext/**"
      - "packages/*/src/**"
      - "packages/*/rust/**"
      - "tools/benchmark-harness/**"
      - "tools/e2e-generator/**"
      - "e2e/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/config.toml"
      - "fixtures/**"
      - ".github/workflows/ci-rust.yaml"
      - "alef.toml"
      - ".alef-ownership.toml"
      - "poly.toml"
  workflow_dispatch: {}

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: "ci"

permissions:
  contents: read

jobs:
  validate-rust:
    name: "Validate: Rust"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Check Rust Formatting
        run: task rust:lint:check
        shell: bash

      - name: Run Clippy
        run: task rust:lint:check
        shell: bash

      - name: Check feature flags (html-to-markdown)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check -p html-to-markdown-rs --no-default-features
          cargo check -p html-to-markdown-rs --no-default-features --features visitor
          cargo check -p html-to-markdown-rs --no-default-features --features metadata
          cargo check -p html-to-markdown-rs --no-default-features --features inline-images

  # ~keep Runs as its own job, not a step in validate-rust. When it lived there it never
  # executed once: `Check Rust Formatting` failed first and aborted the job, so 246 drifted
  # files went unreported while CI was red for an unrelated reason. A gate that cannot be
  # reached is indistinguishable from one that cannot fail.
  verify-bindings:
    name: "Validate: binding freshness"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      # ~keep Enforcement is the DEFAULT: `alef verify` returns a failure status on drift, and
      # `--report-only` is the opt-out — never add it here. The `--exit-code` flag this step
      # used to pass is a hidden deprecated no-op as of alef 0.76.0 (absent from `verify --help`),
      # so it was removed rather than left implying it is what makes the gate strict.
      - name: Verify binding freshness
        run: alef verify

  rust-tests:
    name: "Test: Rust (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache-key-prefix: rust-tests-${{ matrix.os }}

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run Rust Tests
        env:
          RUST_BACKTRACE: full
        run: task rust:test:ci
        shell: bash

      - name: Run E2E Tests
        run: task rust:e2e:test
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1

  rust-coverage:
    name: "Coverage: Rust"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Generate Rust Coverage
        run: task rust:coverage:check
        shell: bash

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ github.sha }}
          path: rust-coverage.lcov
          retention-days: 7

  # ~keep Pinned to ubuntu-24.04 so a schema-v2 calibrated baseline can approve an
  # exact runner provenance key. Until that 40-run calibration is reviewed, the
  # checked-in schema-v1 files retain blocking percentage-only enforcement and
  # print a migration warning. Schema v2 never skips an incompatible runner: a
  # provenance mismatch or missing fixture floor is a configuration failure. Host identity
  # (CPU model and core count) is the one exception, handled at the compare step below.
  benchmark-regression:
    name: "Benchmark: Regression guardrail"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmark-regression

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run benchmark harness
        run: task bench:run
        shell: bash

      # ~keep Uploaded before the comparison and with always(), because the run this job
      # produces is the only way to re-cut baselines/baseline.json: `bench:compare` runs here
      # on ubuntu-latest, so a baseline captured on a developer machine is being compared
      # against CI hardware and the percentages mean nothing. Without this the results file is
      # discarded on every run, including the failing ones worth inspecting.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: tools/benchmark-harness/results/latest.json
          retention-days: 14

      # ~keep ALLOW_HOST_MISMATCH is passed here and nowhere else. `ubuntu-24.04` is one label
      # over a mixed pool (AMD EPYC and Intel Xeon hosts), and the calibration campaign is
      # workflow_dispatch-only, so it can only be captured on whichever host it drew. Without
      # this, a run that drew the other vendor reported timing violations that are hardware
      # differences, not code. It does not relax the provenance contract — a changed rustc,
      # profile, build flag, feature set, or runner class still hard-fails — and on a runner
      # whose CPU does match the baseline it changes nothing, so a real regression still fails.
      - name: Compare against baseline (fails on regression beyond threshold)
        run: task bench:compare ALLOW_HOST_MISMATCH=true
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1
