# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust is pinned by
# rust-toolchain.toml, and alef by alef_version in alef.toml, not here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]

[task_config]
includes = ["mise-tasks", "mise-tasks/test-apps.toml"]

[tools]
python = "3.13.18"
uv = "0.13.6"
node = "26.12.1"
pnpm = "12.11.2"
go = "1.27.3"
java = "temurin-25.0.5+8.0.LTS"
ruby = "3.4.12"
zig = "0.16.0"
"github:Goldziher/poly" = "0.31.2"
"github:Goldziher/ai-rulez" = "5.9.2"
cargo-deny = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
gh = "2.103.3"
jq = "1.8.2"
actionlint = "1.7.12"
bats = "1.14.0"
lychee = "0.24.2"

[env]
# Repository specifics for the shared task sets (toolchains.toml task_sets). ~keep
BATS_LIB_REF = "v1.29.0"

# ---- Shared task bodies ------------------------------------------------------------------------
# Shared tasks from the xberg-io/toolchains task library; this file supplies their repo specifics. ~keep

[tasks."governance:hooks:install"]
description = "Provision machine preferences and install reviewed AI governance hooks"
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.0/tasks/governance/hooks-install.sh"

[tasks.deps]
description = "Update or upgrade one ecosystem's dependencies, or every ecosystem"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.0/tasks/deps/refresh.sh"
env.DEPS_LANGS = "rust python node ruby php go java csharp elixir dart swift kotlin-android zig"
env.DEPS_RUST_MANIFESTS = """\
  packages/ruby/ext/html_to_markdown_rb/native/Cargo.toml \
  packages/elixir/native/html_to_markdown_nif/Cargo.toml \
  packages/r/src/rust/Cargo.toml"""
env.DEPS_NODE_DIRS = "packages/typescript crates/html-to-markdown-wasm"
env.DEPS_PHP_DIR = "crates/html-to-markdown-php/src"

[tasks."alef:pin:check"]
description = "Fail unless the alef on PATH is the clean release alef.toml pins"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.0/tasks/alef/pin-check.sh"

[tasks."alef:regenerate"]
description = "Regenerate every alef output that carries the version"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.0/tasks/alef/regenerate.sh"

[tasks."alef:verify:strict"]
description = "Run alef verify and fail on drifted frozen paths too"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.0/tasks/alef/verify-strict.sh"

# ---- Entry points ------------------------------------------------------------------------------

[tasks.default]
description = "List available tasks"
run = "mise tasks ls"

[tasks.setup]
description = "Install all dependencies and dev tools"
run = ["mise install", { task = "rust:install" }, "alef setup", { task = "governance:hooks:install" }]

[tasks.build]
description = "Build Rust core library only"
run = [{ task = "rust:build" }]

[tasks.test]
description = "Run Rust core test suite only"
run = [{ task = "rust:test" }]

[tasks."test:bindings"]
description = "Run binding test suites only (skip Rust core)"
run = "alef test"

[tasks."test:scripts:lib:sync"]
description = "Refresh the vendored Bats helper library from xberg-io/actions"
run = "scripts/task/sync-bats-lib.sh sync"

[tasks."test:scripts:lib:check"]
description = "Fail when the vendored Bats helper library has drifted from its pinned source"
run = "scripts/task/sync-bats-lib.sh --check"

[tasks."test:ci"]
description = "Run all tests with coverage (CI mode)"
run = [{ task = "rust:test:ci" }, "alef test --coverage"]

[tasks.lint]
description = "Lint all code via poly"
run = "poly lint ."

[tasks.format]
description = "Format all code via poly"
run = "poly fmt --fix ."

[tasks."format:check"]
description = "Check code formatting without modifications"
run = "poly fmt --check ."

[tasks.check]
description = "Run all checks (format + lint, no modifications)"
run = [{ task = "format:check" }, { task = "lint" }, { task = "node:verify-loader" }]

[tasks."check:ffi-symbols:known"]
description = "Diff exported htm_* FFI symbols against the symbols bindings call, treating the known-missing allowlist as non-blocking"
run = "python3 scripts/check_ffi_symbols.py --allow-known"

[tasks."check:quality-warnings"]
description = "Fail on unsuppressed poly quality warnings"
run = "python3 scripts/check_quality_warnings.py"

[tasks.update]
description = "Update all dependencies (within major versions)"
run = ["alef update", "gau --update .", "mise run deps update"]

[tasks.upgrade]
description = "Upgrade all dependencies to latest (including breaking changes)"
run = ["alef update --latest", "gau --update .", "mise run deps upgrade"]

[tasks.clean]
description = "Remove build artifacts across all languages"
run = [{ task = "rust:clean" }, "alef clean"]

# ---- Governance and plugin ---------------------------------------------------------------------

[tasks."governance:generate"]
description = "Validate and regenerate local governance with the reviewed generator"
run = ["ai-rulez validate --no-local", "ai-rulez generate --no-local --strict-config"]

[tasks."governance:check"]
description = "Check materialized local governance outputs against shared sources"
run = "ai-rulez generate --check --no-local --strict-config"

# Coding-agent plugin (Claude Code, Cursor, Codex, Gemini, Kimi, OpenCode, Factory,
# Hermes, Pi). Single source of truth: plugin/.ai-rulez/config.plugins.toml + plugin/.ai-rulez/skills.
# ai-rulez generate --plugin fans it out to per-runtime bundles under plugin/ and the
# repo-root marketplace index. Version tracks core via `mise run version:sync`. ~keep
[tasks."plugin:generate"]
description = "Regenerate the plugin bundles + marketplace from plugin/.ai-rulez"
run = ["ai-rulez generate --plugin", "python3 scripts/sync_public_skills.py"]

[tasks."plugin:verify"]
description = "Verify generated plugin bundles match source (byte + BLAKE3 provenance)"
run = ["ai-rulez verify --plugin", "python3 scripts/sync_public_skills.py --check"]

[tasks."plugin:test"]
description = "Verify OpenCode tools and bundled resources"
run = "node --test scripts/tests/opencode-plugin.test.mjs"

[tasks."plugin:hermes:test"]
description = "Verify the Hermes bridge against a real MCP stdio fixture"
run = "uv run --no-project --python 3.11 --with mcp==1.28.1 --with PyYAML==6.0.3 python scripts/tests/test_hermes_plugin.py"

[tasks."plugin:skills:test"]
description = "Verify public skill ownership and resource freshness"
run = ["python3 scripts/tests/test_public_skills.py", "python3 scripts/sync_public_skills.py --check"]

[tasks."plugin:launcher:test"]
description = "Verify npm launcher preserves caller directory and relative configuration"
run = "python3 scripts/tests/test_mcp_launcher_cwd.py"

# ---- Versions and publishing -------------------------------------------------------------------

[tasks."version:sync"]
description = "Synchronize version across all package manifests"
run = [
  { task = "alef:pin:check" },
  "alef sync-versions",
  "python3 scripts/sync_consumer_versions.py",
  { task = "version:lockfiles" },
  { task = "alef:regenerate" },
  # Pin plugin/.ai-rulez/config.plugins.toml [plugin].version to core, then regenerate the
  # per-runtime bundles under plugin/ from it. ~keep
  "python3 scripts/sync_plugin_version.py",
  "ai-rulez generate --plugin",
  "python3 scripts/sync_public_skills.py",
  { task = "alef:verify:strict" },
]

[tasks."version:show"]
description = "Show current version from Cargo.toml"
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.0/tasks/version/cargo.sh"

[tasks."version:bump:major"]
description = "Bump major version (X.0.0) and sync"
run = ["alef sync-versions --bump major", { task = "version:sync" }]

[tasks."version:bump:minor"]
description = "Bump minor version (0.X.0) and sync"
run = ["alef sync-versions --bump minor", { task = "version:sync" }]

[tasks."version:bump:patch"]
description = "Bump patch version (0.0.X) and sync"
run = ["alef sync-versions --bump patch", { task = "version:sync" }]

[tasks."publish:validate"]
description = "Validate publish manifests are consistent"
run = "alef publish validate"

[tasks."publish:prepare"]
description = "Prepare packages for publishing (vendor deps, stage FFI)"
run = "alef publish prepare"

[tasks."publish:build"]
description = "Build release artifacts for all languages"
run = "alef publish build"

[tasks."publish:package"]
description = "Package built artifacts into distributable archives"
run = "alef publish package -o dist/"

# ---- alef --------------------------------------------------------------------------------------

[tasks."alef:generate"]
description = "Regenerate all Alef-managed outputs without building"
# @napi-rs/cli 3.x emits an explicit `module.exports.<name> = nativeBinding.<name>` line for
# every runtime export, so cjs-module-lexer resolves named ESM imports straight off napi's
# output (#450). The post-build re-export fixup that used to run here is gone; do not
# reintroduce one. `node:verify-esm` is the guard that this stays true. ~keep
# ~keep `alef all` never builds the per-language artifacts that a `compile`/`typecheck`
# `docs.snippets.validation_level` needs (only `alef build` does), so leaving validation on
# spawns a doomed toolchain per snippet and cannot pass by construction. Discovery, the
# reference-page audit and gap detection still run. Use `mise run alef:snippets` after
# `alef build` when you actually want validation.
run = "alef all --clean --skip-snippet-validation --skip-compile"

[tasks."alef:verify"]
description = "Check Alef-generated files are up to date"
run = "alef verify --exit-code"

[tasks."alef:snippets"]
description = "Validate documentation snippets (needs built artifacts; run after alef build)"
run = "alef snippets check"

[tasks."alef:build"]
description = "Build all language bindings"
run = "alef build"

[tasks."alef:sync"]
description = "Sync the version to all manifests and the plugin version pin"
# Delegate instead of calling `alef sync-versions` directly: release runs that used the bare
# command left the plugin version pin behind. ~keep
run = [{ task = "version:sync" }]

[tasks."alef:docs"]
description = "Generate API reference documentation"
run = "alef docs"

[tasks."readme:generate"]
description = "Generate package READMEs using alef"
run = "alef readme"

# ---- Docs --------------------------------------------------------------------------------------

[tasks."docs:build"]
description = "Build documentation"
run = ["pnpm --dir docs-site install --frozen-lockfile", "pnpm --dir docs-site build"]

[tasks."docs:serve"]
description = "Serve documentation locally with live reload"
run = ["pnpm --dir docs-site install", "pnpm --dir docs-site dev"]

[tasks."docs:lint:prose"]
description = "Lint prose with textlint"
run = "pnpm exec textlint 'docs-site/src/content/docs/**/*.{md,mdx}'"

[tasks."docs:snippets:list"]
description = "List all discovered snippets"
run = "alef snippets list --snippets docs-site/src/snippets"

[tasks."docs:snippets:gaps"]
description = "Report snippet coverage gaps (missing variants, unreferenced files, etc.)"
# kotlin is absent from the required set: alef.toml gives kotlin_android
# exclude_functions = ["visitor"], because its trait-bridge emitter cannot bind via an
# options field. The binding therefore has no visitor API and alef stops emitting the 49
# visitor and 5 visitor edge-case snippets for it, which requiring kotlin here reports as
# 54 permanent gaps. ~keep
run = """\
  alef snippets gaps --snippets docs-site/src/snippets --docs docs-site/src/content/docs \
  --required-languages rust,python,typescript,go,ruby,php,java,csharp,elixir,r,c,swift,dart,zig"""

[tasks."docs:snippets:audit"]
description = "Run structural audit (frontmatter, fences, includes)"
run = "alef snippets audit --snippets docs-site/src/snippets --docs docs-site/src/content/docs"

# ---- Rust --------------------------------------------------------------------------------------

[tasks."rust:install"]
description = "Install the rust-toolchain.toml toolchain and its components"
run = ["rustup toolchain install", "cargo --version", "rustc --version"]

[tasks."rust:audit"]
description = "Check Rust dependencies for advisories, license, and source violations (cargo-deny)"
run = "cargo deny check"

[tasks."rust:build"]
description = "Build all Rust crates with the BUILD_PROFILE profile (default: release)"
run = 'cargo build --workspace --profile "${BUILD_PROFILE:-release}"'

# ~keep The CI coverage job previously only generated rust-coverage.lcov and
# uploaded it as an artifact — nothing ever read the number, so the job passed
# regardless of coverage (html-to-markdown audit #39). `--fail-under-lines`
# turns it into a real gate. The floor is a regression tripwire, NOT the
# aspirational 95%-core/80%-bindings target documented in CLAUDE.md: a measured
# run of this exact command on 2026-08-11 came in at ~32.9% line coverage
# workspace-wide (the binding shim crates — node/wasm/ffi/jni/dart/swift — have
# near-zero direct Rust unit tests since they're covered by e2e suites in their
# target language, not `cargo test`). Setting the floor at the documented target
# would fail every CI run today; 30% is a few points below the current measured
# value so it catches a real regression without being a no-op.
[tasks."rust:coverage:check"]
description = "Generate code coverage report and fail if line coverage regresses below the floor"
run = [{ task = "rust:coverage --fail-under-lines 30" }]

[tasks."rust:test:complexity"]
description = "Run the stray closing tag complexity regression"
run = """\
  cargo test --locked --release -p html-to-markdown-rs --features full,testkit \
  --test stray_closing_tags_complexity -- --nocapture"""

[tasks."rust:lint:check"]
description = "Lint Rust code WITHOUT auto-fix (check-only)"
run = ["cargo fmt --all --check", "cargo clippy --workspace -- -D warnings"]

[tasks."rust:format"]
description = "Format Rust code (with modifications)"
run = "cargo fmt --all"

[tasks."rust:format:check"]
description = "Check Rust formatting without modifications"
run = "cargo fmt --all --check"

[tasks."rust:clean"]
description = "Clean Rust build artifacts"
run = "cargo clean"

[tasks."rust:e2e:test"]
description = "Run Rust E2E tests in e2e/rust directory"
run = "cargo test --manifest-path e2e/rust/Cargo.toml"

# ---- Python ------------------------------------------------------------------------------------

[tasks."python:build"]
description = "Build Python bindings with maturin (release unless BUILD_PROFILE says otherwise)"
dir = "packages/python"
run = 'if [ "${BUILD_PROFILE:-release}" = release ]; then maturin develop --release; else maturin develop; fi'

# ---- Node --------------------------------------------------------------------------------------

[tasks."node:audit"]
description = "Check Node.js dependencies for known vulnerabilities (pnpm audit)"
run = "pnpm audit --audit-level=high"

[tasks."node:install:bun"]
description = "Install workspace dependencies with Bun"
run = "bun install"

[tasks."node:build:bun"]
description = "Build the host Node binding with Bun"
dir = "crates/html-to-markdown-node"
run = "bun run build"

[tasks."node:verify-esm"]
description = "Assert named ESM imports resolve from the built Node binding (#450 guard)"
# Requires an already-built host binding: the guard loads the real `.node`, so it cannot run
# after a bare `alef:generate` (nothing built) or in the cross-compiling publish pipeline
# (artifact targets a foreign platform). ~keep
run = "node crates/html-to-markdown-node/scripts/verify-esm-exports.mjs"

[tasks."node:verify-loader"]
description = "Assert the committed Node index.js loader matches package.json and index.d.ts"
# Purely static, so unlike `node:verify-esm` it needs nothing built and can run in the
# publish pipeline. index.js is committed source that publish ships verbatim, and a
# `napi build` run from the repo root silently rewrites it to reference
# `html-to-markdown-monorepo-*` packages that are never published. ~keep
run = [
  "node crates/html-to-markdown-node/scripts/verify-loader-manifest.mjs",
  "node --test crates/html-to-markdown-node/scripts/loader-errors.test.mjs",
]

[tasks."node:e2e:test"]
description = "Build Node binding and run e2e/node fixture tests"
run = ["alef test --e2e --lang node", { task = "node:verify-esm" }]

# ---- Other bindings ----------------------------------------------------------------------------

[tasks."r:docs:verify"]
description = "Check committed R reference pages against a fresh roxygen2 render"
run = "scripts/ci/r/verify-reference.sh"

# ---- E2E ---------------------------------------------------------------------------------------

[tasks."e2e:generate"]
description = "Generate E2E tests for all languages from fixtures"
run = "alef e2e generate"

[tasks."e2e:test"]
description = "Run E2E tests for all languages"
run = "alef test --e2e"

# ---- Benchmarks --------------------------------------------------------------------------------

[tasks."bench:build"]
description = "Build the benchmark harness before settling the runner"
run = "cargo build --release -p html-to-markdown-bench --bin htmbench"

[tasks."bench:telemetry:test"]
description = "Exercise telemetry boundaries, invalid evidence controls and real subprocess aborts"
run = "uv run --no-sync python -m pytest scripts/tests/test_benchmark_telemetry.py -q"

[tasks."bench:oracle"]
description = "Verify oracle snapshots match current output"
run = "cargo run --release -p html-to-markdown-bench -- oracle"
